<main class="container section-space">
  <h1>Projetos</h1>
  <p>Catálogo completo de projetos com foco em performance, escalabilidade e experiência digital.</p>

  <div class="projects-grid">
    <article class="project-card" *ngFor="let project of projects$ | async">
      <img [src]="project.image" [alt]="project.name" loading="lazy" />
      <div class="project-content">
        <h2>{{ project.name }}</h2>
        <p>{{ project.description }}</p>
        <a [href]="project.url" target="_blank" rel="noopener noreferrer">Conhecer projeto</a>
      </div>
    </article>
  </div>
</main>
